# LoLo Simulator Topic Mappings
# Maps simulator topics to standard SMaRC topics
# Note: LoLo simulator already publishes many topics in SMaRC format!

# These are already in SMaRC format, just pass through
smarc_format_topics:
  altitude:
    input_topic: '/lolo/smarc/altitude'
    output_topic: 'smarc/altitude'
    msg_type: 'std_msgs/Float32'
    
  battery_percent:
    input_topic: '/lolo/smarc/battery_percent'
    output_topic: 'smarc/battery_percent'
    msg_type: 'std_msgs/Float32'
    
  course:
    input_topic: '/lolo/smarc/course'
    output_topic: 'smarc/course'
    msg_type: 'std_msgs/Float32'
    
  depth:
    input_topic: '/lolo/smarc/depth'
    output_topic: 'smarc/depth'
    msg_type: 'std_msgs/Float32'
    
  heading:
    input_topic: '/lolo/smarc/heading'
    output_topic: 'smarc/heading'
    msg_type: 'std_msgs/Float32'
    
  latlon:
    input_topic: '/lolo/smarc/latlon'
    output_topic: 'smarc/latlon'
    msg_type: 'geographic_msgs/GeoPoint'
    
  odom:
    input_topic: '/lolo/smarc/odom'
    output_topic: 'smarc/odom'
    msg_type: 'nav_msgs/Odometry'
    
  speed:
    input_topic: '/lolo/smarc/speed'
    output_topic: 'smarc/speed'
    msg_type: 'std_msgs/Float32'

# Raw sensor topics
sensors:
  gps:
    input_topic: '/lolo/core/gps'
    output_topic: 'core/gps'
    msg_type: 'sensor_msgs/NavSatFix'
    
  imu:
    input_topic: '/lolo/core/imu'
    output_topic: 'core/imu'
    msg_type: 'sensor_msgs/Imu'
    
  depth_pressure:
    input_topic: '/lolo/core/depth_pressure'
    output_topic: 'core/depth_pressure'
    msg_type: 'sensor_msgs/FluidPressure'
    
  dvl:
    input_topic: '/lolo/core/dvl'
    output_topic: 'core/dvl'
    msg_type: 'sensor_msgs/Range'
    
  leak:
    input_topic: '/lolo/core/leak'
    output_topic: 'core/leak'
    msg_type: 'std_msgs/Bool'

